name: DecoAD-cpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - numpy=1.23.5
  - scipy=1.9.3
  - scikit-learn=1.1.3
  - matplotlib=3.5.3
  - pillow=9.2.0
  - tqdm=4.64.1
  - pyyaml=6.0
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - cpuonly
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.0.1+cpu.html
      - py2neo
      - opencv-python==4.8.1.78
      - torch-geometric==2.3.1
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv
